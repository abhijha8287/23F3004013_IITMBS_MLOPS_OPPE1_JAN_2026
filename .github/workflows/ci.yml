name: CI

on:
  push:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas scikit-learn pytest

    # 🔥 REAL PIPELINE CHECK
    - name: Run tests
     run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest tests/

    # Optional but good
    - name: Generate report
      run: |
        echo "CI ran real tests successfully" > report.md

    - name: Setup CML
      uses: iterative/setup-cml@v2

    - name: Post report
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Model tested with real inference" >> report.md

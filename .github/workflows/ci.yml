name: stock-ci

on:
  push:
    branches:
      - master

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout

      uses: actions/checkout@v3


    - name: Setup Python

      uses: actions/setup-python@v4

      with:
        python-version: "3.10"


    - name: Install dependencies

      run: |
        pip install -r requirements.txt


    - name: Install DVC

      run: |
        pip install dvc[gs]


    - name: Pull data

      run: |
        dvc pull || true


    - name: Run training sanity

      run: |
        python src/train.py data/v0 models/model_test.pkl || true


    - name: CML report

      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      run: |
        pip install cml

        echo "## Stock Model Pipeline" > report.md

        echo "Pipeline executed successfully" >> report.md

        cml comment create report.md

name: CI

on:
  push:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas scikit-learn pytest

    - name: Sanity test
      run: |
        python -c "print('Pipeline OK')"

    - name: Create report
      run: |
        echo "CI completed successfully" > report.md

    - name: CML Report
      uses: iterative/setup-cml@v2

    - name: Post report
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Pipeline verified" >> report.md
